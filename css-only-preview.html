<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Preview — contador 100% CSS</title>
<link rel="stylesheet" href="countdown.css">
<style>
  body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #FFF8F1; }
  .card { background: #00595D; color: #FFF8F1; border-radius: 16px; padding: 24px 40px; text-align: center; }
  .wcbr-count-days::before { font-size: 4rem; font-weight: 800; }
  .label { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 8px; }
</style>
</head>
<body>
  <div class="card">
    <span class="wcbr-count-days"></span>
    <div class="label">dias para o WordCamp Brasil 2026</div>
  </div>
</body>
</html>
