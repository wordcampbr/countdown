<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador WordCamp Brasil 2026</title>
<style>
  :root {
    --cyan-700: #00595D;
    --cyan-900: #003E3E;
    --orange-600: #C6360B;
    --sand-100: #FFF8F1;
    --sand-300: #E9E0D8;
    --gray-700: #4A5654;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .countdown {
    width: 100%;
    max-width: 640px;
    background: var(--sand-100);
    border: 1px solid var(--sand-300);
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
  }
  .countdown__label {
    margin: 0 0 16px;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--cyan-700);
  }
  .countdown__grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .countdown__unit {
    background: var(--cyan-700);
    color: var(--sand-100);
    border-radius: 10px;
    padding: 12px 4px;
  }
  .countdown__value {
    display: block;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .countdown__unit-label {
    display: block;
    margin-top: 4px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.85;
  }
  .countdown__done {
    color: var(--orange-600);
    font-weight: 700;
    font-size: 1.2rem;
  }
  .countdown__footer {
    margin: 16px 0 0;
    font-size: 0.85rem;
    color: var(--gray-700);
  }
  .countdown__footer a {
    color: var(--cyan-700);
    font-weight: 600;
    text-decoration: none;
  }
  .countdown__footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="countdown wcbr-countdown">
  <p class="countdown__label">Faltam para o WordCamp Brasil 2026</p>
  <div class="countdown__grid">
    <div class="countdown__unit">
      <span class="countdown__value wcbr-count-num">--</span>
      <span class="countdown__unit-label">dias</span>
    </div>
    <div class="countdown__unit">
      <span class="countdown__value wcbr-count-num">--</span>
      <span class="countdown__unit-label">horas</span>
    </div>
    <div class="countdown__unit">
      <span class="countdown__value wcbr-count-num">--</span>
      <span class="countdown__unit-label">min</span>
    </div>
    <div class="countdown__unit">
      <span class="countdown__value wcbr-count-num">--</span>
      <span class="countdown__unit-label">seg</span>
    </div>
  </div>
  <p class="countdown__footer">30 e 31 de outubro de 2026 · Belo Horizonte (FUMEC) — <a href="https://brasil.wordcamp.org/2026/" target="_blank" rel="noopener">brasil.wordcamp.org/2026</a></p>
</div>

<!--
  Teste do countdown-live.svg como <img>: como imagem, o <script> embutido no SVG
  não roda (navegadores desativam script em SVG carregado via <img>), então isso
  vai renderizar os placeholders "--" parados, não um contador vivo. Pra ticar de
  verdade, o SVG precisa ir via <iframe src="...svg"> ou <object type="image/svg+xml">.
-->
<img decoding="async" src="https://wordcampbr.github.io/countdown/countdown-live.svg" alt="">

<script>
( function () {
    'use strict';

    /* ---------------------------------------------------------------- *
     * Countdown to the opening keynote
     * ---------------------------------------------------------------- */
    function initCountdown() {
        var root = document.querySelector( '.wcbr-countdown' );

        if ( ! root ) {
            return;
        }

        var slots = root.querySelectorAll( '.wcbr-count-num' );

        if ( slots.length < 4 ) {
            return;
        }

        // 30 October 2026, 12:30 (BRT / UTC-3).
        var target = new Date( Date.UTC( 2026, 9, 30, 15, 30, 0 ) ).getTime();

        function pad( value ) {
            return value < 10 ? '0' + value : String( value );
        }

        function tick() {
            var diff = target - Date.now();

            if ( diff <= 0 ) {
                diff = 0;
            }

            var totalSeconds = Math.floor( diff / 1000 );
            var days = Math.floor( totalSeconds / 86400 );
            var hours = Math.floor( ( totalSeconds % 86400 ) / 3600 );
            var minutes = Math.floor( ( totalSeconds % 3600 ) / 60 );
            var seconds = totalSeconds % 60;

            slots[ 0 ].textContent = String( days );
            slots[ 1 ].textContent = pad( hours );
            slots[ 2 ].textContent = pad( minutes );
            slots[ 3 ].textContent = pad( seconds );
        }

        tick();
        window.setInterval( tick, 1000 );
    }

    function init() {
        initCountdown();
    }

    if ( document.readyState === 'loading' ) {
        document.addEventListener( 'DOMContentLoaded', init );
    } else {
        init();
    }
}() );
</script>

</body>
</html>
